<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4881e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>X1 Home</title>
<style>
:root{--bg:#f2f1ec;--cd:#fff;--bd:#dedcd2;--tx:#1f1f1d;--mu:#6b6a64;--ac:#c9770f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--cd:#1b1e23;--bd:#30343b;--tx:#ecebe4;--mu:#a09e95;--ac:#f0a43a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
#app{max-width:460px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 80px)}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);background:var(--cd)}.pill.live{background:#d7f0dd;color:#0f3d1f;border-color:#9ed3ad}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;transition:background .3s}.c.lit{background:#fff3c4;color:#2c2400}.c.lit .m{color:#6b5a10}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px}.k small{display:block;color:var(--mu);font-size:11px}.k b{font-size:21px}
.b{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;margin:4px 6px 0 0}.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}.b.r{background:#e5484d;color:#fff;border-color:#e5484d}
.c.lit .b{background:#fff;color:#222}input[type=text],input[type=password]{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}input[type=range]{width:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:460px;width:100%}nav button{flex:1;font:inherit;font-size:11px;background:none;border:0;color:var(--mu);padding:8px 2px;cursor:pointer}nav button.a{color:var(--ac);font-weight:600}nav button span{display:block;font-size:18px}
.m{color:var(--mu);font-size:12px}.chat{background:var(--bg);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:13px}.chat small{display:block;color:var(--mu);font-size:10px}
canvas{width:100%;display:block;border-radius:10px;border:1px solid var(--bd)}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px;align-items:center}.row:last-child{border:0}
.pr{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}.pr i{display:block;height:100%;background:var(--ac);width:0}
.al{background:#f9d4d4;color:#6a1111;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600}
#lg{max-width:360px;margin:12vh auto 0;text-align:center}#lg .c{padding:20px}
.face{height:150px;display:flex;align-items:center;justify-content:center;font-size:64px;background:var(--bg);border-radius:12px;position:relative;overflow:hidden}.face.sc::after{content:"";position:absolute;left:0;right:0;height:3px;background:#4aa3ff;animation:sc 1s linear infinite}@keyframes sc{from{top:0}to{top:100%}}
</style></head><body><div id="app"></div>
<script>
var $=function(i){return document.getElementById(i)},LIVE=false,TOKEN="",scr="home",tg=true,L=[],pin="1234",ROOMS=["Living room","Bedroom","Kitchen"],ota={esp:0,pi:0,v:"1.8.0"},
H={light:[0,0,0],fan:[0,0,0],locked:1,valve:1,mode:"Home",alarm:"",presence:1,outside:32,watts:20,kwh:0,temp:[27,27,27],routines:[{hour:19,room:"Living room",level:80,days:6}]},
WH=[],base=[],heater=0,face={st:"idle",who:"",conf:0},visitors=[],voiceOut="Say or type a command.",done=[],lastRun={};
function api(p){return fetch(p,{headers:{"X-Token":TOKEN}}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function log(t){L.unshift({t:t,at:new Date().toLocaleTimeString().slice(0,5)});L=L.slice(0,40)}
function act(p,fn){if(LIVE)api(p).then(function(s){Object.assign(H,s)});else fn()}
function setL(i,v){act("/api/light/"+i+"/"+v,function(){H.light[i]=v})}
function setF(i,v){act("/api/fan/"+i+"/"+v,function(){H.fan[i]=v})}
function setLock(v){act("/api/lock/"+v,function(){H.locked=v;log(v?"Door locked":"Door unlocked")})}
function setMode(m){act("/api/mode/"+m,function(){H.mode=m;H.alarm="";if(m=="Away"){H.locked=1;H.light=[0,0,0];H.fan=[0,0,0]}if(m=="Sleep"){H.locked=1;H.light=[0,0,0]}if(m=="Movie")H.light=[20,0,0];if(m=="Home")H.light=[60,0,0];log("Scene: "+m)})}
function clearA(){act("/api/clear",function(){H.alarm="";H.valve=1;log("Alarm cleared")})}
function danger(k){H.alarm=k;if(k=="gas"){H.fan[2]=1;log("Gas leak: valve closed, kitchen fan on")}if(k=="smoke"){H.locked=0;H.light=[100,100,100];log("Smoke: door unlocked, lights on")}if(k=="water"){H.valve=0;log("Water leak: main valve closed")}log("Telegram alert sent: "+k)}
function energy(){var w=20+H.light.reduce(function(a,l){return a+l*.12},0)+H.fan.reduce(function(a,f){return a+f*45},0)+(heater?1500:0);H.watts=w;H.kwh+=w/3.6e6*60;WH.push(w);WH=WH.slice(-80);
 if(WH.length>40){var b=WH.slice(0,-5),mu=b.reduce(function(a,v){return a+v},0)/b.length,sd=Math.sqrt(b.reduce(function(a,v){return a+(v-mu)*(v-mu)},0)/b.length)||1,rc=WH.slice(-3).reduce(function(a,v){return a+v},0)/3;if((rc-mu)/sd>3&&rc>mu+50&&heater){log("⚠ Unusual power use: "+Math.round(rc)+" W (normal about "+Math.round(mu)+" W). Faulty heater switched off.");heater=0}}}
function sim(){H.temp=H.temp.map(function(t,i){return t+((H.outside-(H.fan[i]?5:0))-t)*.03});H.temp.forEach(function(t,i){if(H.mode!="Away"&&t>28&&!H.fan[i]){H.fan[i]=1;log(ROOMS[i]+" is "+Math.round(t)+"°C: fan on")}if(t<27&&H.fan[i]&&H.mode!="Away"){H.fan[i]=0}});
 var hr=new Date().getHours();done.forEach(function(r){var k=r.hour+r.room;if(hr==r.hour&&lastRun[k]!=new Date().getDate()){lastRun[k]=new Date().getDate();H.light[ROOMS.indexOf(r.room)]=r.level;log("Routine ran: "+r.room+" light "+r.level+"%")}});energy()}
function nav(){var t=[["home","🏠","Home"],["door","🚪","Door"],["voice","🎙️","Voice"],["en","⚡","Energy"],["more","⚙️","More"]];return "<nav><div>"+t.map(function(x){return '<button class="'+(scr==x[0]?"a":"")+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+"</span>"+x[2]+"</button>"}).join("")+"</div></nav>"}
function go(s){scr=s;draw()}
function head(t){return '<div class="top"><h1>'+t+'</h1><span class="pill '+(LIVE?"live":"")+'">'+(LIVE?"● Live hub":"Demo mode")+"</span></div>"+(H.alarm?'<div class="al">ALERT: '+({gas:"Gas leak in the kitchen",smoke:"Smoke detected",water:"Water leak",intruder:"Intruder alert"}[H.alarm]||H.alarm)+' <button class="b" onclick="clearA()">Clear</button></div>':"")}
function home(){var h=head("Home")+'<div class="g"><div class="k"><small>Mode</small><b style="font-size:17px">'+H.mode+'</b></div><div class="k"><small>Outside</small><b>'+Math.round(H.outside||0)+'°C</b></div></div><div style="margin-bottom:6px">'+["Home","Movie","Sleep","Away"].map(function(m){return '<button class="b '+(H.mode==m?"p":"")+'" onclick="setMode(\''+m+'\')">'+m+"</button>"}).join("")+"</div>";
 h+='<div class="c"><div class="row" style="border:0"><span>📱 Phone nearby (Bluetooth presence)</span><b>'+(H.presence?"Home":"Away")+"</b></div>"+(LIVE?"":'<button class="b" onclick="presence()">'+(H.presence?"Leave the house":"Arrive home")+"</button>")+'<div class="m">When you leave, the Pi switches the lights off. It uses the ESP32 Bluetooth scan.</div></div>';
 ROOMS.forEach(function(r,i){h+='<div class="c '+(H.light[i]?"lit":"")+'"><div class="top" style="margin:0"><b>'+r+'</b><span style="font-size:22px;font-weight:600">'+Math.round(H.temp[i])+'°</span></div><div class="m">Light '+(H.light[i]?H.light[i]+"%":"off")+" · Fan "+(H.fan[i]?"on":"off")+'</div><input type="range" min="0" max="100" value="'+H.light[i]+'" onchange="setL('+i+',+this.value)"><button class="b" onclick="setF('+i+','+(H.fan[i]?0:1)+')">Fan: '+(H.fan[i]?"on":"off")+"</button></div>"});return h}
function presence(){H.presence=H.presence?0:1;if(!H.presence){H.light=[0,0,0];H.fan=[0,0,0];log("Phone left: lights and fans switched off")}else{H.light[0]=60;log("Welcome home: living room light on")}}
function door(){var f=face,em=f.st=="scan"?"🙂":f.st=="ok"?"✅":f.st=="no"?"❓":"👤";return head("Front door")+'<div class="c"><div class="top" style="margin:0"><b>'+(H.locked?"🔒 Locked":"🔓 Unlocked")+'</b><button class="b '+(H.locked?"":"p")+'" onclick="setLock('+(H.locked?0:1)+')">'+(H.locked?"Unlock":"Lock")+'</button></div></div><div class="c"><h2>Face recognition camera</h2><div class="face '+(f.st=="scan"?"sc":"")+'">'+em+'</div><div class="m" style="margin:6px 0">'+(f.st=="scan"?"Scanning...":f.st=="ok"?"Recognised "+f.who+" ("+f.conf+"%). Door unlocked.":f.st=="no"?"Unknown person. Snapshot sent to your phone.":"Choose who is at the door to try it.")+'</div><button class="b" onclick="faceT(\'Dad\')">Dad arrives</button><button class="b" onclick="faceT(\'Mom\')">Mom arrives</button><button class="b r" onclick="faceT(\'\')">Stranger</button></div><div class="c"><h2>Visitors</h2>'+(visitors.length?visitors.map(function(v){return '<div class="row"><span>'+v.w+"</span><span class=m>"+v.at+"</span></div>"}).join(""):'<div class="m">No visitors yet.</div>')+"</div>"}
function faceT(w){face={st:"scan",who:w,conf:0};draw();setTimeout(function(){if(w){face={st:"ok",who:w,conf:92+Math.floor(Math.random()*6)};H.locked=0;log("Door unlocked for "+w+" (face recognised)")}else{face={st:"no",who:"",conf:0};log("Unknown person at the door: snapshot sent to Telegram")}visitors.unshift({w:w||"Unknown person",at:new Date().toLocaleTimeString().slice(0,5)});draw()},1400)}
function voice(){return head("Voice")+'<div class="c"><button class="b p" style="width:100%;font-size:18px;padding:14px" onclick="mic()">🎙️ Tap and speak</button><input type="text" id="vi" placeholder=\'Try "turn on kitchen light"\' style="margin-top:8px" onkeydown="if(event.key==\'Enter\'){say(this.value)}"><div class="chat" style="margin-top:10px" id="vo">'+voiceOut+'</div><div class="m">Examples: turn on bedroom light · set living room light to 30 · lock the door · movie mode · how much power</div></div><div class="c m">On the real board, <b>voice.py</b> uses Vosk to understand speech offline on the Pi. Here your browser listens instead.</div>'}
function mic(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){voiceOut="This browser has no speech recognition. Type a command instead.";draw();return}try{var r=new SR();r.lang="en-IN";r.onresult=function(e){say(e.results[0][0].transcript)};r.onerror=function(){voiceOut="Could not hear you. Type a command instead.";draw()};r.start();voiceOut="Listening...";draw()}catch(e){}}
function say(t){t=t.toLowerCase();var o="Sorry, I did not understand.",ri=-1,m;ROOMS.forEach(function(r,i){if(t.indexOf(r.split(" ")[0].toLowerCase())>=0)ri=i});
 if(m=t.match(/(\w+) mode/)){var s=m[1][0].toUpperCase()+m[1].slice(1);if(["Home","Movie","Sleep","Away"].indexOf(s)>=0){setMode(s);o=s+" mode on."}}
 else if(/unlock/.test(t)){setLock(0);o="Door unlocked."}else if(/lock/.test(t)){setLock(1);o="Door locked."}
 else if(ri>=0&&/light/.test(t)&&(m=t.match(/(\d+)/))){setL(ri,+m[1]);o=ROOMS[ri]+" light at "+m[1]+"%."}
 else if(ri>=0&&/light/.test(t)){var v=/off/.test(t)?0:80;setL(ri,v);o=ROOMS[ri]+" light "+(v?"on":"off")+"."}
 else if(ri>=0&&/fan/.test(t)){var f=/off/.test(t)?0:1;setF(ri,f);o=ROOMS[ri]+" fan "+(f?"on":"off")+"."}
 else if(/power|energy/.test(t))o="Using "+Math.round(H.watts)+" W now and "+H.kwh.toFixed(2)+" kWh today.";
 voiceOut='You: "'+t+'"<br>Home: '+o;log('Voice: "'+t+'"');draw()}
function en(){return head("Energy")+'<div class="g"><div class="k"><small>Power now</small><b>'+Math.round(H.watts)+' W</b></div><div class="k"><small>Cost today</small><b>₹'+(H.kwh*8).toFixed(2)+'</b></div></div><div class="c"><h2>Power use</h2><canvas id="cw" width="400" height="120"></canvas><div class="m" style="margin-top:6px">Energy today: '+H.kwh.toFixed(3)+' kWh (price assumed ₹8 per kWh)</div></div><div class="c"><h2>Anomaly detection</h2><div class="m">The Pi learns your normal power use. If a reading jumps far above normal, it warns you and can cut the appliance.</div>'+(LIVE?"":'<button class="b r" onclick="heater=1;log(\'A faulty heater was plugged in\');draw()">Plug in a faulty heater</button>')+"</div>"}
function chartW(){var c=$("cw");if(!c)return;var x=c.getContext("2d");x.clearRect(0,0,400,120);var mx=Math.max(200,Math.max.apply(null,WH)*1.1);x.strokeStyle="#e0a020";x.lineWidth=2.5;x.beginPath();WH.forEach(function(v,i){var X=i*(400/79),Y=114-v/mx*108;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}
function more(){var h=head("More");h+='<div class="c"><h2>Safety sensors (test)</h2>'+(LIVE?'<div class="m">Live sensors are read from the board.</div>':'<button class="b" onclick="danger(\'gas\');draw()">Gas leak</button><button class="b" onclick="danger(\'smoke\');draw()">Smoke</button><button class="b" onclick="danger(\'water\');draw()">Water leak</button>')+'<div class="m" style="margin-top:6px">Water valve: '+(H.valve?"open":"CLOSED")+"</div></div>";
 h+='<div class="c"><h2>Learned routines</h2>'+(H.routines.length?H.routines.map(function(r,i){var on=done.some(function(d){return d.room==r.room&&d.hour==r.hour});return '<div class="row"><span>'+r.room+" light "+r.level+"% at "+("0"+r.hour).slice(-2)+':00<br><small class="m">You did this on '+r.days+' days</small></span><button class="b '+(on?"p":"")+'" onclick="acc('+i+')">'+(on?"Added ✔":"Add")+"</button></div>"}).join(""):'<div class="m">No routines learned yet.</div>')+'</div>';
 h+='<div class="c"><h2>Messages</h2><button class="b '+(tg?"p":"")+'" onclick="tg=!tg;draw()">Telegram alerts: '+(tg?"on":"off")+"</button>"+(L.length?L.slice(0,8).map(function(a){return '<div class="chat"><small>'+a.at+(tg?" · sent to Telegram":"")+"</small>"+a.t+"</div>"}).join(""):'<div class="m">No activity yet.</div>')+"</div>";
 h+='<div class="c"><h2>Security and system</h2><div class="row"><span>Login token</span><b>Required ✔</b></div><div class="row"><span>MQTT broker</span><b>Connected</b></div><div class="row"><span>x1/home/state</span><span class="m">every 0.5 s</span></div><div class="row"><span>Firmware</span><b>'+ota.v+'</b></div><button class="b" onclick="upd(\'esp\')">Update ESP32 (OTA)</button><button class="b" onclick="upd(\'pi\')">Update Pi</button><div class="pr"><i id="op" style="width:'+Math.max(ota.esp,ota.pi)+'%"></i></div><div class="m" id="ot">Updates go over WiFi, no cable.</div><div class="m" style="margin-top:8px">Install: browser menu, then Add to Home Screen.</div></div>';return h}
function acc(i){var r=H.routines[i],k=-1;done.forEach(function(d,j){if(d.room==r.room&&d.hour==r.hour)k=j});if(k>=0)done.splice(k,1);else{done.push(r);log("Routine added: "+r.room+" light at "+r.hour+":00")}draw()}
function upd(w){var n=0,t=setInterval(function(){n+=8;ota[w]=Math.min(100,n);if($("op"))$("op").style.width=ota[w]+"%";if($("ot"))$("ot").textContent=(w=="esp"?"ESP32":"Pi")+" updating: "+ota[w]+"%";if(n>=100){clearInterval(t);ota.v="1.8."+(+ota.v.split(".")[2]+1);if($("ot"))$("ot").textContent="Updated to version "+ota.v;log("Firmware updated to "+ota.v)}},250)}
function draw(){var a=document.activeElement;if(a&&a.type=="range")return;$("app").innerHTML=(scr=="home"?home():scr=="door"?door():scr=="voice"?voice():scr=="en"?en():more())+nav();if(scr=="en")chartW()}
function login(){var v=$("tk").value;TOKEN=v;if(v==pin){start();return}api("/api/state").then(function(s){LIVE=true;Object.assign(H,s);start()}).catch(function(e){if(e==401)$("er").textContent="Wrong token.";else if(v==pin)start();else $("er").textContent="No hub found. For the demo, the PIN is 1234."})}
function start(){draw();setInterval(function(){if(LIVE)api("/api/state").then(function(s){Object.assign(H,s);draw()}).catch(function(){});else{sim();if(scr=="home"||scr=="en"||scr=="more")draw()}},1000)}
$("app").innerHTML='<div id="lg"><div class="c"><h1>🏠 X1 Home</h1><p class="m">Enter your hub token to connect. Demo PIN: 1234</p><input type="password" id="tk" placeholder="Token or PIN" onkeydown="if(event.key==\'Enter\')login()"><button class="b p" style="margin-top:10px;width:100%" onclick="login()">Unlock</button><div id="er" class="m" style="color:#e5484d;margin-top:6px"></div></div></div>';
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script></body></html>
