<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e8b57"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>X1 Irrigation</title>
<style>
:root{--bg:#f2f1ec;--cd:#fff;--bd:#dedcd2;--tx:#1f1f1d;--mu:#6b6a64;--ac:#2e8b57;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--cd:#1b1e23;--bd:#30343b;--tx:#ecebe4;--mu:#a09e95;--ac:#4fc183}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
#app{max-width:460px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 80px)}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);background:var(--cd)}.pill.live{background:#d7f0dd;color:#0f3d1f;border-color:#9ed3ad}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px}.k small{display:block;color:var(--mu);font-size:11px}.k b{font-size:21px}
.bar{height:10px;background:var(--bd);border-radius:5px;position:relative;margin:8px 0}.bar i{display:block;height:100%;border-radius:5px;background:#3a9ad9}.bar u{position:absolute;top:-3px;width:2px;height:16px;background:#e5484d}
.b{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;margin:4px 6px 0 0}.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}.b.r{background:#e5484d;color:#fff;border-color:#e5484d}
select,input[type=text],input[type=password]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}select{width:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:460px;width:100%}nav button{flex:1;font:inherit;font-size:11px;background:none;border:0;color:var(--mu);padding:8px 2px;cursor:pointer}nav button.a{color:var(--ac);font-weight:600}nav button span{display:block;font-size:18px}
.m{color:var(--mu);font-size:12px}.chat{background:var(--bg);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:13px}.chat small{display:block;color:var(--mu);font-size:10px}
canvas{width:100%;display:block;border-radius:10px;border:1px solid var(--bd)}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}.row:last-child{border:0}
.pr{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}.pr i{display:block;height:100%;background:var(--ac);width:0}
#lg{max-width:360px;margin:12vh auto 0;text-align:center}#lg .c{padding:20px}
</style></head><body><div id="app"></div>
<script>
var $=function(i){return document.getElementById(i)},LIVE=false,TOKEN="",scr="home",tg=true,A=[],ET={Tomato:1.1,Rice:1.2,Wheat:1,Chilli:.9},CR={tomato:[40,65],rice:[60,85],wheat:[25,50],chilli:[35,60]},AREA=20,doc=null,ota={esp:0,pi:0,v:"2.3.1"},pin="1234";
var S={zones:[{crop:"tomato",soil:52,fault:0},{crop:"rice",soil:70,fault:0},{crop:"wheat",soil:44,fault:0}],tank:82,temp:31,hum:62,rain:0,flow_lpm:0,litres_today:0,active:0,auto:1,battery:78,tmax:36,tmin:25,et0_mm:0,need_l:[0,0,0]};
var HIST=[];for(var d=6;d>=0;d--)HIST.push({d:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][(new Date().getDay()+6-d)%7],l:Math.round(120+Math.random()*140)});
function api(p){return fetch(p,{headers:{"X-Token":TOKEN}}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function alertAdd(t){A.unshift({t:t,at:new Date().toLocaleTimeString().slice(0,5)});A=A.slice(0,30)}
function et0(){var tm=(S.tmax+S.tmin)/2;return Math.max(0,.0023*(tm+17.8)*Math.sqrt(Math.max(S.tmax-S.tmin,1))*.408*36)}
function sim(){
 S.et0_mm=+et0().toFixed(2);S.need_l=S.zones.map(function(z){return +(S.et0_mm*ET[z.crop[0].toUpperCase()+z.crop.slice(1)]*AREA).toFixed(1)});
 S.zones.forEach(function(z,i){if(z.fault){z.soil=0;return}z.soil-=.12*S.temp/30;if(S.rain)z.soil+=.8;if(S.active==i+1)z.soil+=1.2;z.soil=Math.max(0,Math.min(100,z.soil))});
 S.flow_lpm=S.active?8:0;if(S.active){S.tank=Math.max(0,S.tank-.25);S.litres_today+=8/60}
 var h=new Date().getHours();S.battery=Math.max(10,Math.min(100,S.battery+(h>=7&&h<17?.15:-.05)));
 if(!S.auto)return;
 if(S.active){var z=S.zones[S.active-1];if(z.soil>=CR[z.crop][1]||S.rain||S.tank<10||z.fault){alertAdd("Pump stopped in zone "+S.active);S.active=0}return}
 if(S.rain)return;if(S.tank<10){if(!sim.t){sim.t=1;alertAdd("Water tank is low")}return}sim.t=0;
 var need=[];S.zones.forEach(function(z,i){if(!z.fault&&z.soil<CR[z.crop][0])need.push([z.soil-CR[z.crop][0],i])});
 if(need.length){need.sort(function(a,b){return a[0]-b[0]});S.active=need[0][1]+1;alertAdd("Watering zone "+S.active+" ("+Math.round(S.zones[S.active-1].soil)+"% soil)")}}
function act(p,fn){if(LIVE)api(p).then(function(s){Object.assign(S,s)});else fn()}
function pumpZ(z){act("/api/pump/"+(S.active==z?0:z),function(){S.auto=0;S.active=S.active==z?0:z})}
function setAuto(){var v=S.auto?0:1;act("/api/auto/"+v,function(){S.auto=v})}
function setCrop(i,v){act("/api/crop/"+(i+1)+"/"+v,function(){S.zones[i].crop=v})}
function nav(){var t=[["home","🌱","Home"],["doc","🍃","Doctor"],["ins","📊","Insights"],["al","💬","Alerts"],["sys","⚙️","System"]];return "<nav><div>"+t.map(function(x){return '<button class="'+(scr==x[0]?"a":"")+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+"</span>"+x[2]+"</button>"}).join("")+"</div></nav>"}
function go(s){scr=s;draw()}
function head(t){return '<div class="top"><h1>'+t+'</h1><span class="pill '+(LIVE?"live":"")+'">'+(LIVE?"● Live hub":"Demo mode")+"</span></div>"}
function home(){var h=head("Irrigation")+'<div class="g"><div class="k"><small>Water tank</small><b>'+Math.round(S.tank)+'%</b></div><div class="k"><small>Water today</small><b>'+Math.round(S.litres_today)+' L</b></div><div class="k"><small>Solar battery</small><b>'+Math.round(S.battery||0)+'%</b></div><div class="k"><small>Temp · humidity</small><b>'+Math.round(S.temp)+"° · "+Math.round(S.hum||0)+'%</b></div></div>';
 h+='<div class="c"><button class="b '+(S.auto?"p":"")+'" onclick="setAuto()">Auto mode: '+(S.auto?"on":"off")+'</button>'+(LIVE?"":'<button class="b" onclick="S.rain=S.rain?0:1">'+(S.rain?"Stop rain":"Make it rain")+"</button>")+'<div class="m" style="margin-top:6px">'+(S.rain?"Rain detected: watering paused.":"Auto mode waters the driest zone first and uses the crop targets.")+"</div></div>";
 S.zones.forEach(function(z,i){var c=CR[z.crop],on=S.active==i+1;h+='<div class="c"><div class="top" style="margin:0"><b>Zone '+(i+1)+'</b><select onchange="setCrop('+i+',this.value)">'+Object.keys(CR).map(function(k){return"<option"+(k==z.crop?" selected":"")+">"+k+"</option>"}).join("")+'</select></div><div style="font-size:26px;font-weight:600">'+(z.fault?"Sensor fault":Math.round(z.soil)+"%")+'</div><div class="bar"><i style="width:'+z.soil+'%"></i><u style="left:'+c[0]+'%"></u><u style="left:'+c[1]+'%;background:#2e8b57"></u></div><div class="m">Target '+c[0]+"-"+c[1]+"% · "+(on?"Watering now":"Idle")+'</div><button class="b '+(on?"r":"p")+'" onclick="pumpZ('+(i+1)+')">'+(on?"Stop":"Water now")+"</button></div>"});return h}
function leaf(kind){var c=$("cvx"),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,240,240);x.save();x.translate(120,120);x.rotate(-.5);x.fillStyle="#3f9a3f";x.beginPath();x.ellipse(0,0,100,55,0,0,7);x.fill();x.strokeStyle="#2a6e2a";x.lineWidth=3;x.beginPath();x.moveTo(-100,0);x.lineTo(100,0);x.stroke();
 var n=kind=="spot"?9:kind=="blight"?26:0,r=Math.random;for(var i=0;i<n;i++){var px=-80+r()*160,py=-35+r()*70,rad=kind=="blight"?7+r()*9:3+r()*4;x.fillStyle="rgba(215,190,60,.8)";x.beginPath();x.arc(px,py,rad+3,0,7);x.fill();x.fillStyle=kind=="blight"?"#4a2c14":"#8b5a2b";x.beginPath();x.arc(px,py,rad,0,7);x.fill()}x.restore();analyse()}
function analyse(){var c=$("cvx"),x=c.getContext("2d"),d=x.getImageData(0,0,c.width,c.height).data,g=0,b=0;for(var i=0;i<d.length;i+=16){var r=d[i],gg=d[i+1],bl=d[i+2];if(r>225&&gg>225&&bl>225)continue;if(r<25&&gg<25&&bl<25)continue;if(gg>r&&gg>bl)g++;else if(r>=gg*.8&&bl<r*.75&&r>60)b++}
 var tot=g+b,ratio=tot?b/tot:0,lab,conf,adv;if(tot<40){lab="No leaf found";conf=0;adv="Point the camera at one leaf on a plain background."}else if(ratio<.05){lab="Healthy leaf";conf=Math.round(90+Math.min(8,(.05-ratio)*100));adv="No action needed."}else if(ratio<.17){lab="Possible leaf spot";conf=Math.round(70+ratio*100);adv="Remove the worst leaves, avoid watering the leaves, and check again in 2 days."}else{lab="Possible blight";conf=Math.round(75+Math.min(20,ratio*50));adv="Isolate the plant, remove infected leaves and consider a copper-based fungicide."}
 doc={lab:lab,conf:conf,adv:adv,ratio:Math.round(ratio*100)};if(lab!="Healthy leaf"&&conf>0)alertAdd(lab+" ("+conf+"% sure) on the leaf scan, zone "+($("dz")?$("dz").value:1));drawDoc()}
function drawDoc(){var r=$("dr");if(!r||!doc)return;r.innerHTML='<h2>'+doc.lab+(doc.conf?" · "+doc.conf+"% sure":"")+'</h2><div class="m">Damaged area: about '+doc.ratio+'% of the leaf</div><p style="margin:6px 0 0">'+doc.adv+"</p>"}
function docScr(){return head("Plant Doctor")+'<div class="c"><canvas id="cvx" width="240" height="240"></canvas><div class="m" style="margin:6px 0">Use a sample leaf, or take a photo of a real leaf on a plain background.</div><button class="b" onclick="leaf(\'ok\')">Healthy</button><button class="b" onclick="leaf(\'spot\')">Leaf spot</button><button class="b" onclick="leaf(\'blight\')">Blight</button><label class="b" style="display:inline-block">📷 Photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="pic(this)"></label><div style="margin-top:8px" class="m">Zone: <select id="dz"><option>1</option><option>2</option><option>3</option></select></div></div><div class="c" id="dr"><div class="m">Results appear here.</div></div><div class="c m">On the real board, <b>disease_detect.py</b> runs a TensorFlow Lite model on the Pi camera photo. This page uses a simple colour check to show the idea.</div>'}
function pic(i){var f=i.files[0];if(!f)return;var im=new Image();im.onload=function(){var c=$("cvx"),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,240,240);var s=Math.min(240/im.width,240/im.height);x.drawImage(im,0,0,im.width*s,im.height*s);analyse()};im.src=URL.createObjectURL(f)}
function ins(){var h=head("Insights"),tot=S.need_l.reduce(function(a,b){return a+b},0);h+='<div class="c"><h2>Smart watering (evapotranspiration)</h2><div class="g" style="margin:0"><div class="k"><small>ET today</small><b>'+S.et0_mm+' mm</b></div><div class="k"><small>Water the crops lost</small><b>'+Math.round(tot)+' L</b></div></div>'+S.zones.map(function(z,i){return '<div class="row"><span>Zone '+(i+1)+" · "+z.crop+'</span><b>'+S.need_l[i]+" L</b></div>"}).join("")+'<div class="m" style="margin-top:6px">The Pi works out the water each crop lost from temperature, crop type and area, and plans the exact amount instead of a fixed timer.</div></div>';
 h+='<div class="c"><h2>Water used, last 7 days (litres)</h2><canvas id="cvh" width="400" height="140"></canvas><div class="m" style="margin-top:6px">Stored in the Pi database. Flow meter right now: <b>'+(+S.flow_lpm).toFixed(1)+' L/min</b></div></div>';
 var ph=6.4,ec=1.2,n=38,p=22,k=60;h+='<div class="c"><h2>Soil nutrients (pH, EC, NPK sensors)</h2><div class="row"><span>pH</span><b>'+ph+'</b></div><div class="row"><span>EC</span><b>'+ec+' mS/cm</b></div><div class="row"><span>Nitrogen</span><b>'+n+' mg/kg</b></div><div class="row"><span>Phosphorus</span><b>'+p+' mg/kg</b></div><div class="row"><span>Potassium</span><b>'+k+' mg/kg</b></div><div class="m" style="margin-top:6px">Advice: pH is in the good range. Nitrogen is a little low, so add a light dose of urea within a week.</div></div>';return h}
function chartH(){var c=$("cvh");if(!c)return;var x=c.getContext("2d"),mx=Math.max.apply(null,HIST.map(function(v){return v.l}))*1.15;x.clearRect(0,0,400,140);HIST.forEach(function(v,i){var bw=40,X=14+i*55,H=v.l/mx*105;x.fillStyle="#3a9ad9";x.fillRect(X,120-H,bw,H);x.fillStyle="#888";x.font="11px sans-serif";x.fillText(v.d,X+8,136);x.fillText(v.l,X+8,114-H)})}
function alerts(){return head("Alerts")+'<div class="c"><button class="b '+(tg?"p":"")+'" onclick="tg=!tg;draw()">Telegram alerts: '+(tg?"on":"off")+'</button><button class="b" onclick="alertAdd(\'Test alert from HYBRID-X1\');draw()">Send test</button><div class="m" style="margin-top:6px">'+(tg?"Alerts are also sent to your Telegram bot.":"Alerts stay in this app only.")+"</div></div>"+(A.length?A.map(function(a){return '<div class="chat"><small>'+a.at+(tg?" · sent to Telegram":"")+"</small>"+a.t+"</div>"}).join(""):'<div class="c m">No alerts yet.</div>')}
function sys(){var h=head("System");h+='<div class="c"><h2>Security</h2><div class="m">The hub needs a secret token for every request. Change it in the environment variable HUB_TOKEN, and put HTTPS (Caddy) in front of the hub.</div><div class="row"><span>Login</span><b>Token required ✔</b></div></div>';
 h+='<div class="c"><h2>MQTT messaging</h2><div class="row"><span>Broker (Mosquitto on the Pi)</span><b>Connected</b></div><div class="row"><span>x1/irrigation/esp32</span><span class="m">every 5 s</span></div><div class="row"><span>x1/irrigation/state</span><span class="m">every 1 s</span></div><div class="row"><span>x1/irrigation/disease</span><span class="m">every 6 h</span></div></div>';
 h+='<div class="c"><h2>Over-the-air updates</h2><div class="row"><span>Firmware version</span><b>'+ota.v+'</b></div><button class="b" onclick="upd(\'esp\')">Update ESP32</button><button class="b" onclick="upd(\'pi\')">Update Pi software</button><div class="pr"><i id="op" style="width:'+Math.max(ota.esp,ota.pi)+'%"></i></div><div class="m" id="ot">Updates are sent over WiFi, with no cable.</div></div>';
 h+='<div class="c"><h2>Power and range</h2><div class="row"><span>Solar panel</span><b>'+(new Date().getHours()>=7&&new Date().getHours()<17?"Charging":"Night, on battery")+'</b></div><div class="row"><span>Battery</span><b>'+Math.round(S.battery)+'%</b></div><div class="row"><span>LoRa field node 1</span><b>-92 dBm · 3.2 km</b></div></div>';
 h+='<div class="c"><h2>Install this app</h2><div class="m">Open this page on your phone, then use the browser menu: Add to Home Screen. It then opens like a normal app.</div></div>';return h}
function upd(w){var n=0,t=setInterval(function(){n+=8;ota[w]=Math.min(100,n);if($("op"))$("op").style.width=ota[w]+"%";if($("ot"))$("ot").textContent=(w=="esp"?"ESP32":"Pi")+" updating: "+ota[w]+"%";if(n>=100){clearInterval(t);ota.v="2.3."+(+ota.v.split(".")[2]+1);if($("ot"))$("ot").textContent="Updated to version "+ota.v;alertAdd("Firmware updated to "+ota.v)}},250)}
function draw(){var a=document.activeElement;if(a&&(a.tagName=="SELECT"||a.type=="file"))return;var h=scr=="home"?home():scr=="doc"?docScr():scr=="ins"?ins():scr=="al"?alerts():sys();$("app").innerHTML=h+nav();if(scr=="ins")chartH();if(scr=="doc")drawDoc()}
function login(){var v=$("tk").value;TOKEN=v;if(v==pin){start();return}api("/api/state").then(function(s){LIVE=true;Object.assign(S,s);start()}).catch(function(e){if(e==401){$("er").textContent="Wrong token."}else if(v==pin){start()}else $("er").textContent="No hub found. For the demo, the PIN is 1234."})}
function start(){draw();setInterval(function(){if(LIVE)api("/api/state").then(function(s){Object.assign(S,s);draw()}).catch(function(){});else{sim();if(scr!="doc"&&scr!="sys")draw();else if(scr=="sys"&&!document.activeElement.id)draw()}},1000)}
$("app").innerHTML='<div id="lg"><div class="c"><h1>🌱 X1 Irrigation</h1><p class="m">Enter your hub token to connect. Demo PIN: 1234</p><input type="password" id="tk" placeholder="Token or PIN" onkeydown="if(event.key==\'Enter\')login()"><button class="b p" style="margin-top:10px;width:100%" onclick="login()">Unlock</button><div id="er" class="m" style="color:#e5484d;margin-top:6px"></div></div></div>';
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script></body></html>
